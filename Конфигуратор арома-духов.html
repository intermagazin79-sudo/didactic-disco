*{box-sizing:border-box}
body{margin:0;background:#120d16;min-height:100vh;color:var(--tx);font:16px/1.5 Inter,system-ui,sans-serif}
.w{max-width:680px;margin:0 auto;padding:24px 16px 48px}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;margin:0}
h1{font-size:36px;line-height:1.1;text-shadow:0 2px 14px rgba(0,0,0,.6)}h2{font-size:28px}h3{font-size:22px}
.sub{text-shadow:0 1px 8px rgba(0,0,0,.6);color:var(--mu);margin:8px 0 24px}
.card{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:var(--card);box-shadow:0 8px 30px rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px}
.bar{height:4px;background:var(--bd);border-radius:2px;margin-bottom:20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:14px 16px;margin-top:10px;font:inherit;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--ac);background:var(--ac2)}
.btn{background:var(--ac);color:#2a1622;border:0;border-radius:12px;padding:12px 20px;font:500 15px Inter,sans-serif;cursor:pointer}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.tag{display:inline-block;font-size:13px;color:var(--ac);background:var(--ac2);padding:3px 10px;border-radius:99px}
.tier{margin-top:18px}
.tier h4{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%}
.ing{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.ing:last-child{border:0}
.ctr{display:flex;align-items:center;gap:10px}
.ctr button{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:18px;cursor:pointer}
.ctr b{min-width:28px;text-align:center;font-weight:500}
.vis{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px 0 6px;background:var(--bd)}
.vis div{transition:width .3s}
.sum{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;color:var(--mu);font-size:14px}
select{background:#2a1d30;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font:inherit}
.warn{font-size:14px;color:var(--mu);border-left:3px solid var(--ac);padding-left:12px;margin-top:16px}
.hide{display:none}
details{margin-top:16px;border:1px solid var(--bd);border-radius:12px;padding:12px 16px;background:var(--bg)}
summary{cursor:pointer;font-weight:500}
details ol{padding-left:20px;margin:10px 0 0}details li{margin-bottom:8px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.pick .opt{margin:0;text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:600}
</style>

const Q=[

 {q:'Какой вечер вам ближе всего?',o:[['Прогулка по лесу или парку',{m:0,w:0}],['Ужин при свечах, потрескивает камин',{m:1,w:1}],{m:['Вечер у воды, свежий ветер',2],w:['Дома под пледом с чашкой чая',2]},{m:['Бар с живой музыкой и джазом',3],w:['Театр или ресторан, нарядное платье',4]},{m:['Поход в горы с палаткой',4],w:['Дневной чай в уютном кафе',5]}]},

 {q:'Как вас описывают друзья?',o:[['Энергичный, собранный',{m:0,w:3}],['Загадочный, глубокий',{m:3,w:4}],['Спокойный, открытый',{m:2,w:2}],['Уверенный, независимый',{m:4,w:1}],{m:['Тёплый, душевный',1],w:['Мягкий, мечтательный',5]}]},
 {q:'Какой запах вызывает улыбку?',o:[['Цитрус и свежая зелень',{m:0,w:3}],['Специи, дерево, лёгкая сладость',{m:1,w:1}],{m:['Морская вода и травы',2],w:['Сливочное тепло и цветы',2]},{m:['Дым, кожа, смола',3],w:['Ваниль, смола, янтарь',4]},{m:['Хвоя и горная прохлада',4],w:['Персик и зелёный чай',5]}]}
];
let g=null,step=0,votes=[0,0,0,0,0,0],cur=null,base=null,vol=10;
const $=s=>document.querySelector(s);
const gk=()=>g==='u'?'m':g, vi=v=>g==='u'?[0,1,2,3,0][v]:v, gname=()=>({m:'Мужской',w:'Женский',u:'Унисекс'})[g];
const app=$('#app');
function quiz(){
 const q=Q[step];
 app.innerHTML=`<div class="card"><div class="bar"><i style="width:${step/Q.length*100}%"></i></div>
 <span class="tag">Вопрос ${step+1} из ${Q.length}</span><h2 style="margin-top:12px">${q.q}</h2>
 ${q.o.map((o,i)=>{const x=Array.isArray(o)?o:o[gk()];return `<button class="opt" data-i="${i}">${x[0]}</button>`}).join('')}
 <div class="row"><button class="btn g" id="skip">Пропустить квиз</button></div></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  const o=q.o[+b.dataset.i],x=Array.isArray(o)?o:o[gk()];
  if(q.g){g=x[1]}else{votes[vi(typeof x[1]==='object'?x[1][gk()]:x[1])]++}
  step++;step<Q.length?quiz():result();
 });
 $('#skip').onclick=manual;
}
function manual(){
 app.innerHTML=`<div class="card"><h2>Выберите профиль</h2>
 <div class="pick"><button class="opt" data-g="m">Мужской</button><button class="opt" data-g="w">Женский</button><button class="opt" data-g="u">Унисекс</button></div></div>`;
 app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{g=b.dataset.g;list()});
}
function list(){
 app.innerHTML=`<div class="card"><h2>${({m:'Для мужчин',w:'Для женщин',u:'Унисекс'})[g]}</h2><p class="sub" style="margin-bottom:0">Выберите основу для настройки</p>
 ${R[g].map((r,i)=>`<button class="opt" data-i="${i}"><b style="font-family:'Cormorant Garamond',Georgia,serif;font-size:20px">${r.n}</b><br><span style="color:var(--mu)">${r.d}</span></button>`).join('')}
 <div class="row"><button class="btn g" id="rq">Пройти квиз</button></div></div>`;
 app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>config(+b.dataset.i));
 $('#rq').onclick=()=>{step=0;votes=[0,0,0,0,0,0];g=null;quiz()};
}
function result(){
 const i=votes.indexOf(Math.max(...votes));
 const r=R[g][i];
 app.innerHTML=`<div class="card"><div class="bar"><i style="width:100%"></i></div><span class="tag">Ваш результат</span>
 <h2 style="margin-top:12px">«${r.n}»</h2><p class="sub" style="margin-bottom:0">${r.d}</p>
 <div class="row"><button class="btn" id="go">Настроить рецепт</button><button class="btn g" id="all">Все варианты</button><button class="btn g" id="rs">Пройти заново</button></div></div>`;
 $('#go').onclick=()=>config(i);$('#all').onclick=list;
 $('#rs').onclick=()=>{step=0;votes=[0,0,0,0,0,0];g=null;quiz()};
}
function config(i){
 const r=R[g][i];
 base=JSON.parse(JSON.stringify(r));cur=JSON.parse(JSON.stringify(r));vol=10;
 draw(i);
}
const tiers=[['t','Верхние ноты','--top'],['m','Средние ноты','--mid'],['b','Базовые ноты','--base']];
const sum=k=>cur[k].reduce((s,x)=>s+x[1],0);
function draw(i){
 const T=sum('t'),M=sum('m'),B=sum('b'),all=T+M+B||1;
 const k=vol/10;
 const pct=(all*0.05/10*100).toFixed(1);
 app.innerHTML=`<div class="card"><span class="tag">${gname()} · ${cur.d}</span>
 <h2 style="margin-top:10px">«${cur.n}»</h2>
 <div class="vis"><div style="width:${T/all*100}%;background:var(--top)"></div><div style="width:${M/all*100}%;background:var(--mid)"></div><div style="width:${B/all*100}%;background:var(--base)"></div></div>
 <div class="sum"><span>Верх ${T} · Сердце ${M} · База ${B}</span><span>Итого: <b style="color:var(--tx)">${Math.round(all*k)}</b> капель на ${vol} мл базы</span></div>
 <div class="row" style="align-items:center"><label for="vl" style="color:var(--mu)">Объём базы:</label>
 <select id="vl">${[10,30,50].map(v=>`<option value="${v}" ${v===vol?'selected':''}>${v} мл</option>`).join('')}</select></div>
 ${tiers.map(([key,name,col])=>`<div class="tier"><h4><span class="dot" style="background:var(${col})"></span>${name}</h4>
 ${cur[key].map((x,j)=>`<div class="ing"><span>${x[0]}</span><div class="ctr"><button data-k="${key}" data-j="${j}" data-d="-1" aria-label="меньше">−</button><b>${Math.round(x[1]*k)}</b><button data-k="${key}" data-j="${j}" data-d="1" aria-label="больше">+</button></div></div>`).join('')}</div>`).join('')}
 <p class="warn">Примерная концентрация — ${pct}% (1 капля ≈ 0,05 мл). Для кожи обычно подходит ${pct>15?'ещё меньше: сейчас состав крепкий, уменьшите капли или возьмите больше базы':'не больше 10–15%'}. Сделайте тест на сгибе локтя. Цитрусовые (бергамот, грейпфрут, лайм, лимон) повышают чувствительность к солнцу, а корицу и гвоздику используйте очень осторожно. При беременности и аллергиях проконсультируйтесь с врачом.</p>
 <details><summary>Как адаптировать и проверить аромат</summary><ol><li>Сначала смешайте эфирные масла отдельно в небольшой ёмкости — так проще скорректировать запах до добавления в базу.</li><li>Если слишком ярко, добавьте ещё 1–3 мл базового масла, чтобы снизить концентрацию.</li><li>Если не хватает глубины, добавьте 1 каплю пачули, ветивера или кедра.</li><li>Дайте настояться 24–72 часа в тёмном месте: композиция «созревает», верхние ноты сглаживаются, база раскрывается.</li><li>Наносите на точки пульса (запястья, шея) или на одежду: на ткани аромат держится мягче и дольше.</li></ol></details>
 <div class="row"><button class="btn" id="cp">Скопировать рецепт</button><button class="btn g" id="rst">Сбросить</button><button class="btn g" id="bk">Другие варианты</button></div></div>`;
 app.querySelectorAll('.ctr button').forEach(b=>b.onclick=()=>{
  const x=cur[b.dataset.k][+b.dataset.j];x[1]=Math.max(0,Math.min(15,x[1]+ +b.dataset.d));draw(i)});
 $('#vl').onchange=e=>{vol=+e.target.value;draw(i)};

 $('#bk').onclick=list;
 $('#cp').onclick=()=>{
  const l=tiers.map(([key,name])=>name+': '+cur[key].filter(x=>x[1]).map(x=>x[0]+' — '+Math.round(x[1]*k)).join(', ')).join('\n');
  const txt=`«${cur.n}» (${cur.d})\n${l}\nИтого: ${Math.round(all*k)} капель на ${vol} мл базы`;
  const done=()=>{$('#cp').textContent='Скопировано ✓'};
  try{navigator.clipboard.writeText(txt).then(done,()=>{$('#cp').textContent='Не удалось скопировать'})}catch(e){$('#cp').textContent='Не удалось скопировать'}
 };
}
